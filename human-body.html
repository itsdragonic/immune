<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Human Body</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #2a255a;
    --panel-bg: rgba(20, 17, 60, 0.85);
    --border: rgba(120, 100, 255, 0.25);
    --accent: #7c6ff7;
    --accent2: #c084fc;
    --text: #d4d0ff;
    --text-dim: #8580b8;
    --health-green: #4ade80;
    --health-red: #f87171;
    --func-black: #1a1a2e;
    --glow: rgba(124, 111, 247, 0.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
    z-index: 100;
  }

  header h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.25em;
    color: var(--accent2);
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(192, 132, 252, 0.5);
  }

  .system-filter {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .system-filter label {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-right: 4px;
  }

  .sys-btn {
    padding: 4px 11px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .sys-btn:hover { border-color: var(--accent); color: var(--text); }
  .sys-btn.active {
    background: rgba(124, 111, 247, 0.18);
    border-color: var(--accent);
    color: var(--accent2);
    box-shadow: 0 0 10px rgba(124, 111, 247, 0.2);
  }
  .sys-btn.all-btn.active {
    background: rgba(192, 132, 252, 0.18);
    border-color: var(--accent2);
    color: #fff;
  }

  /* ── Main Layout ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  /* ── Canvas / Viewport ── */
  #viewport {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
  }
  #viewport.grabbing { cursor: grabbing; }

  #world {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    /* transform set by JS */
  }

  #human-body {
    position: relative;
    width: 500px;
    height: 1100px;
  }

  #human-body img.body-base {
    position: absolute;
    top: 0; left: 0;
    width: 500px;
    height: 1100px;
    pointer-events: none;
    user-select: none;
    /* A placeholder tinted silhouette — replace src with body.png */
    filter: drop-shadow(0 0 30px rgba(124,111,247,0.3));
    opacity: 0.9;
  }

  /* ── Organ Sprites ── */
  .organ-wrap {
    position: absolute;
    transform-origin: center center;
    cursor: pointer;
    transition: opacity 0.3s;
  }
  .organ-wrap.hidden { opacity: 0; pointer-events: none; }

  .organ-wrap img {
    display: block;
    pointer-events: none;
    user-select: none;
  }

  /* Health pulse (red) */
  @keyframes pulseRed {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(248,113,113,0.6)); }
    50%       { filter: drop-shadow(0 0 16px rgba(248,113,113,1)) brightness(1.2); }
  }
  /* Functionality pulse (dark/black) */
  @keyframes pulseBlack {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(10,10,30,0.8)) brightness(0.9); }
    50%       { filter: drop-shadow(0 0 14px rgba(10,10,30,1)) brightness(0.4); }
  }
  /* Both */
  @keyframes pulseBoth {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(248,113,113,0.7)) brightness(0.8); }
    50%       { filter: drop-shadow(0 0 14px rgba(248,113,113,1)) brightness(0.45); }
  }

  .organ-wrap.pulse-health img { animation: pulseRed 1.2s ease-in-out infinite; }
  .organ-wrap.pulse-func img   { animation: pulseBlack 1.1s ease-in-out infinite; }
  .organ-wrap.pulse-both img   { animation: pulseBoth 1.0s ease-in-out infinite; }

  /* Hover glow */
  .organ-wrap:not(.hidden):hover img {
    filter: drop-shadow(0 0 10px rgba(192,132,252,0.9)) brightness(1.1);
  }
  /* Override hover when already pulsing */
  .organ-wrap.pulse-health:hover img,
  .organ-wrap.pulse-func:hover img,
  .organ-wrap.pulse-both:hover img { animation-play-state: paused; }

  /* ── Side Panel ── */
  #side-panel {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border-left: 1px solid var(--border);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 16px 20px 10px;
    border-bottom: 1px solid var(--border);
  }
  .panel-header h2 {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  #selected-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .organ-list-section {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
  }

  .organ-card {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: rgba(255,255,255,0.02);
  }
  .organ-card:hover { border-color: var(--accent); background: rgba(124,111,247,0.06); }
  .organ-card.selected { border-color: var(--accent2); background: rgba(192,132,252,0.1); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .card-name { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.05em; }
  .card-systems {
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .bar-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); width: 24px; flex-shrink: 0; }
  .bar-track { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s, background 0.4s; }
  .bar-val { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--text-dim); width: 36px; text-align: right; flex-shrink: 0; }

  /* ── Detail Panel ── */
  #detail-panel {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    min-height: 130px;
    flex-shrink: 0;
  }
  #detail-panel h3 {
    font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 10px;
  }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .stat-box .s-label { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .stat-box .s-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.15rem;
    font-weight: 700;
    margin-top: 2px;
  }
  .stat-box .s-val.ok  { color: var(--health-green); }
  .stat-box .s-val.warn { color: #facc15; }
  .stat-box .s-val.crit { color: var(--health-red); }
  .stat-box .s-val.dead { color: #888; }

  /* Sliders for editing */
  .slider-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .slider-row label { font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); width: 80px; flex-shrink: 0; }
  .slider-row input[type=range] {
    -webkit-appearance: none;
    flex: 1; height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 6px rgba(192,132,252,0.6);
    cursor: pointer;
  }
  .slider-row .sval {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem; color: var(--text);
    width: 34px; text-align: right; flex-shrink: 0;
  }

  /* ── Controls HUD ── */
  #controls-hud {
    position: absolute;
    bottom: 14px; left: 14px;
    display: flex; gap: 6px; flex-direction: column;
    z-index: 50;
  }
  .hud-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    transition: border-color 0.2s, background 0.2s;
  }
  .hud-btn:hover { border-color: var(--accent); background: rgba(124,111,247,0.15); }

  /* ── No selection prompt ── */
  #no-sel {
    color: var(--text-dim);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 20px 10px;
    line-height: 1.8;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <h1>⬡ Anatomica</h1>
  <div class="system-filter">
    <label>Systems</label>
    <button class="sys-btn all-btn active" data-sys="ALL">All</button>
    <!-- populated by JS -->
  </div>
</header>

<!-- ── MAIN ── -->
<div class="main">

  <!-- Viewport -->
  <div id="viewport">
    <div id="world">
      <div id="human-body">
        <!-- Body silhouette -->
        <img class="body-base" src="body.png" alt="Human Body" draggable="false">
        <!-- Organ wraps injected by JS -->
      </div>
    </div>

    <!-- HUD zoom controls -->
    <div id="controls-hud">
      <button class="hud-btn" id="btn-zoom-in"  title="Zoom in">＋</button>
      <button class="hud-btn" id="btn-zoom-out" title="Zoom out">－</button>
      <button class="hud-btn" id="btn-reset"    title="Reset view">⌂</button>
    </div>
  </div>

  <!-- Side Panel -->
  <div id="side-panel">
    <div class="panel-header">
      <h2>Selected Organ</h2>
      <div id="selected-name">—</div>
    </div>
    <div class="organ-list-section" id="organ-list"></div>
    <div id="detail-panel">
      <div id="no-sel">Click an organ on the body<br>or in the list to inspect it.</div>
      <div id="detail-content" style="display:none">
        <h3>Vital Stats</h3>
        <div class="stat-grid">
          <div class="stat-box">
            <div class="s-label">Health</div>
            <div class="s-val" id="d-health">—</div>
          </div>
          <div class="stat-box">
            <div class="s-label">Function</div>
            <div class="s-val" id="d-func">—</div>
          </div>
        </div>
        <div class="slider-row">
          <label>Health</label>
          <input type="range" id="sl-health" min="0" max="100" step="1">
          <span class="sval" id="sl-health-val">100%</span>
        </div>
        <div class="slider-row">
          <label>Function</label>
          <input type="range" id="sl-func" min="0" max="100" step="1">
          <span class="sval" id="sl-func-val">100%</span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════
//  ORGAN DATA
// ═══════════════════════════════════════════════════════════
function Organ({ name, src, scale, x, y, zIndex, systems }) {
  return {
    name,
    src,
    scale:         scale        ?? 1,
    x:             x            ?? 0,
    y:             y            ?? 0,
    zIndex:        zIndex       ?? 1,
    systems:       systems      ?? [],
    health:        100,
    functionality: 100,
    element:       null,   // DOM element reference, set after render
  };
}

// ── Define organs here ──
// x/y are relative to #human-body (500×1100 px)
// Adjust these coordinates to taste once you see the layout.
const organs = [
  Organ({
    name: 'Brain',
    src: 'brain.png',
    scale: 1,
    x: 180, y: 20,
    zIndex: 5,
    systems: ['Nervous'],
  }),
  Organ({
    name: 'Thymus',
    src: 'thymus.png',
    scale: 1,
    x: 205, y: 230,
    zIndex: 4,
    systems: ['Immune', 'Endocrine'],
  }),
  Organ({
    name: 'Heart',
    src: 'heart.png',
    scale: 1,
    x: 220, y: 300,
    zIndex: 3,
    systems: ['Cardiovascular'],
  }),
];

// ═══════════════════════════════════════════════════════════
//  SYSTEM COLOURS (add more as you add organs)
// ═══════════════════════════════════════════════════════════
const SYSTEM_COLORS = {
  'Nervous':       '#a78bfa',
  'Cardiovascular':'#f87171',
  'Immune':        '#34d399',
  'Endocrine':     '#fbbf24',
  'Digestive':     '#fb923c',
  'Respiratory':   '#60a5fa',
  'Musculoskeletal':'#e879f9',
  'Reproductive':  '#f472b6',
  'Urinary':       '#2dd4bf',
  'Lymphatic':     '#86efac',
};

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let selectedOrgan   = null;
let activeFilters   = new Set(['ALL']); // ALL or specific system names

// Pan / Zoom
let scale   = 0.7;
let panX    = 80;
let panY    = 20;
let isPanning = false;
let panStart  = { x: 0, y: 0 };

const MIN_SCALE = 0.2, MAX_SCALE = 3;

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  buildFilterButtons();
  buildOrgans();
  buildOrganList();
  initPanZoom();
  applyTransform();
});

// ═══════════════════════════════════════════════════════════
//  FILTER BUTTONS
// ═══════════════════════════════════════════════════════════
function getAllSystems() {
  const s = new Set();
  organs.forEach(o => o.systems.forEach(sys => s.add(sys)));
  return [...s].sort();
}

function buildFilterButtons() {
  const container = document.querySelector('.system-filter');
  getAllSystems().forEach(sys => {
    const btn = document.createElement('button');
    btn.className = 'sys-btn';
    btn.textContent = sys;
    btn.dataset.sys = sys;
    const col = SYSTEM_COLORS[sys] || '#aaa';
    btn.style.setProperty('--sys-col', col);
    btn.addEventListener('click', () => toggleFilter(sys, btn));
    container.appendChild(btn);
  });

  document.querySelector('.all-btn').addEventListener('click', () => {
    activeFilters = new Set(['ALL']);
    syncFilterButtons();
    applyVisibility();
  });
}

function toggleFilter(sys, btn) {
  if (activeFilters.has('ALL')) activeFilters.delete('ALL');
  if (activeFilters.has(sys)) {
    activeFilters.delete(sys);
    if (activeFilters.size === 0) activeFilters.add('ALL');
  } else {
    activeFilters.add(sys);
  }
  syncFilterButtons();
  applyVisibility();
}

function syncFilterButtons() {
  document.querySelectorAll('.sys-btn').forEach(b => {
    b.classList.toggle('active',
      activeFilters.has(b.dataset.sys) ||
      (b.dataset.sys === 'ALL' && activeFilters.has('ALL'))
    );
  });
}

function applyVisibility() {
  organs.forEach(o => {
    const show = activeFilters.has('ALL') || o.systems.some(s => activeFilters.has(s));
    if (o.element) o.element.classList.toggle('hidden', !show);
    // also update list card
    const card = document.querySelector(`.organ-card[data-name="${o.name}"]`);
    if (card) card.style.display = show ? '' : 'none';
  });
}

// ═══════════════════════════════════════════════════════════
//  BUILD ORGAN DOM
// ═══════════════════════════════════════════════════════════
function buildOrgans() {
  const container = document.getElementById('human-body');
  organs.forEach(organ => {
    const wrap = document.createElement('div');
    wrap.className = 'organ-wrap';
    wrap.dataset.name = organ.name;
    wrap.style.cssText = `
      left: ${organ.x}px;
      top:  ${organ.y}px;
      z-index: ${organ.zIndex};
      transform: scale(${organ.scale});
    `;

    const img = document.createElement('img');
    img.src = organ.src;
    img.alt = organ.name;
    img.draggable = false;

    wrap.appendChild(img);
    container.appendChild(wrap);
    organ.element = wrap;

    wrap.addEventListener('click', () => selectOrgan(organ));
  });
}

// ═══════════════════════════════════════════════════════════
//  ORGAN LIST (side panel)
// ═══════════════════════════════════════════════════════════
function buildOrganList() {
  const list = document.getElementById('organ-list');
  list.innerHTML = '';
  organs.forEach(organ => {
    const card = document.createElement('div');
    card.className = 'organ-card';
    card.dataset.name = organ.name;
    card.innerHTML = `
      <div class="card-top">
        <span class="card-name">${organ.name}</span>
        <span class="card-systems">${organ.systems.join(' · ')}</span>
      </div>
      ${barHTML('HP', organ.health)}
      ${barHTML('FN', organ.functionality)}
    `;
    card.addEventListener('click', () => selectOrgan(organ));
    list.appendChild(card);
  });
}

function barHTML(label, val) {
  const col = barColor(val);
  return `
    <div class="bar-row">
      <span class="bar-label">${label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${val}%;background:${col}"></div></div>
      <span class="bar-val">${val}%</span>
    </div>`;
}

function barColor(val) {
  if (val > 60) return 'var(--health-green)';
  if (val > 20) return '#facc15';
  return 'var(--health-red)';
}

function updateOrganCard(organ) {
  const card = document.querySelector(`.organ-card[data-name="${organ.name}"]`);
  if (!card) return;
  const rows = card.querySelectorAll('.bar-row');
  updateBarRow(rows[0], organ.health);
  updateBarRow(rows[1], organ.functionality);
}

function updateBarRow(row, val) {
  row.querySelector('.bar-fill').style.width     = val + '%';
  row.querySelector('.bar-fill').style.background = barColor(val);
  row.querySelector('.bar-val').textContent       = val + '%';
}

// ═══════════════════════════════════════════════════════════
//  SELECTION
// ═══════════════════════════════════════════════════════════
function selectOrgan(organ) {
  selectedOrgan = organ;

  // highlight card
  document.querySelectorAll('.organ-card').forEach(c => c.classList.remove('selected'));
  const card = document.querySelector(`.organ-card[data-name="${organ.name}"]`);
  if (card) card.classList.add('selected');

  document.getElementById('selected-name').textContent = organ.name;
  document.getElementById('no-sel').style.display      = 'none';
  document.getElementById('detail-content').style.display = '';

  refreshDetailPanel();
}

function refreshDetailPanel() {
  const o = selectedOrgan;
  if (!o) return;

  const dh = document.getElementById('d-health');
  const df = document.getElementById('d-func');
  dh.textContent = o.health + '%';
  df.textContent = o.functionality + '%';

  dh.className = 's-val ' + statusClass(o.health);
  df.className = 's-val ' + statusClass(o.functionality);

  document.getElementById('sl-health').value     = o.health;
  document.getElementById('sl-health-val').textContent = o.health + '%';
  document.getElementById('sl-func').value       = o.functionality;
  document.getElementById('sl-func-val').textContent   = o.functionality + '%';
}

function statusClass(val) {
  if (val > 60) return 'ok';
  if (val > 20) return 'warn';
  if (val > 0)  return 'crit';
  return 'dead';
}

// Sliders
document.getElementById('sl-health').addEventListener('input', e => {
  if (!selectedOrgan) return;
  selectedOrgan.health = parseInt(e.target.value);
  document.getElementById('sl-health-val').textContent = selectedOrgan.health + '%';
  updateOrganVisuals(selectedOrgan);
  refreshDetailPanel();
  updateOrganCard(selectedOrgan);
});

document.getElementById('sl-func').addEventListener('input', e => {
  if (!selectedOrgan) return;
  selectedOrgan.functionality = parseInt(e.target.value);
  document.getElementById('sl-func-val').textContent = selectedOrgan.functionality + '%';
  updateOrganVisuals(selectedOrgan);
  refreshDetailPanel();
  updateOrganCard(selectedOrgan);
});

// ═══════════════════════════════════════════════════════════
//  PULSE CLASSES
// ═══════════════════════════════════════════════════════════
function updateOrganVisuals(organ) {
  if (!organ.element) return;
  const el = organ.element;
  el.classList.remove('pulse-health', 'pulse-func', 'pulse-both');

  const lowHealth = organ.health        < 20;
  const lowFunc   = organ.functionality < 20;

  if (lowHealth && lowFunc) el.classList.add('pulse-both');
  else if (lowHealth)        el.classList.add('pulse-health');
  else if (lowFunc)          el.classList.add('pulse-func');
}

// ═══════════════════════════════════════════════════════════
//  PAN / ZOOM
// ═══════════════════════════════════════════════════════════
function applyTransform() {
  document.getElementById('world').style.transform =
    `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function initPanZoom() {
  const vp = document.getElementById('viewport');

  // Mouse drag
  vp.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    // Don't pan when clicking organs
    if (e.target.closest('.organ-wrap')) return;
    isPanning = true;
    panStart  = { x: e.clientX - panX, y: e.clientY - panY };
    vp.classList.add('grabbing');
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    panX = e.clientX - panStart.x;
    panY = e.clientY - panStart.y;
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    isPanning = false;
    document.getElementById('viewport').classList.remove('grabbing');
  });

  // Touch drag
  let lastTouch = null;
  vp.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });
  vp.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && lastTouch) {
      panX += e.touches[0].clientX - lastTouch.x;
      panY += e.touches[0].clientY - lastTouch.y;
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      applyTransform();
    }
  }, { passive: true });
  vp.addEventListener('touchend', () => { lastTouch = null; });

  // Scroll wheel zoom (toward cursor)
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    const rect  = vp.getBoundingClientRect();
    const mx    = e.clientX - rect.left;
    const my    = e.clientY - rect.top;
    const delta = e.deltaY < 0 ? 1.1 : 0.9;
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * delta));

    // Zoom toward cursor
    panX = mx - (mx - panX) * (newScale / scale);
    panY = my - (my - panY) * (newScale / scale);
    scale = newScale;
    applyTransform();
  }, { passive: false });

  // HUD buttons
  document.getElementById('btn-zoom-in').addEventListener('click', () => {
    zoomCenter(1.2);
  });
  document.getElementById('btn-zoom-out').addEventListener('click', () => {
    zoomCenter(0.85);
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    scale = 0.7; panX = 80; panY = 20;
    applyTransform();
  });
}

function zoomCenter(factor) {
  const vp   = document.getElementById('viewport');
  const mx   = vp.clientWidth  / 2;
  const my   = vp.clientHeight / 2;
  const newS = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
  panX = mx - (mx - panX) * (newS / scale);
  panY = my - (my - panY) * (newS / scale);
  scale = newS;
  applyTransform();
}
</script>
</body>
</html>
